[project]
name = "tunminal"
version = "0.1.1"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "aizcutei", email = "aiz.cutei@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "pydantic>=2.0",
    "qrcode>=7.4",
    "uvicorn[standard]>=0.30.0",
    "websockets>=12.0",
    "pywinpty>=2.0.0; sys_platform == 'win32'",
    "pystray>=0.19.5",
    "pillow>=10.0.0",
]

[project.scripts]
tunminal = "tunminal.cli:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pyinstaller>=6.22.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
